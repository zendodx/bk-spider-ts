appId: com.bkspider.app
productName: 贝壳找房爬虫
copyright: Copyright © 2026

directories:
  output: dist
  buildResources: public

# 打包进 asar 的文件
files:
  - electron/**/*
  - .next/**/*
  - public/**/*
  - node_modules/**/*
  - package.json
  - next.config.js
  # 排除不必要的大文件
  - "!node_modules/.cache/**/*"
  - "!node_modules/electron/**/*"
  - "!node_modules/electron-builder/**/*"
  - "!**/*.map"
  - "!src/**/*"

# asar 解包配置：
# - better-sqlite3 是 native addon，必须在 asar 外才能被 require
# - .next/standalone 包含 server.js，必须在 asar 外才能被 spawn 执行
# electron-builder 会自动针对 Electron Node ABI 重编译解包的 native 模块
asarUnpack:
  - "node_modules/better-sqlite3/**/*"
  - "node_modules/bindings/**/*"
  - "node_modules/file-uri-to-path/**/*"
  - ".next/standalone/**/*"

extraResources:
  - from: resources
    to: resources
    filter:
      - "**/*"
  # 静态资源（CSS/JS chunks）需要在 standalone 可访问的位置
  - from: .next/static
    to: app/.next/standalone/.next/static
    filter:
      - "**/*"

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.utilities
  darkModeSupport: true

win:
  target:
    - target: nsis
      arch:
        - x64
        - ia32
  icon: public/icon.ico

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Utility

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

dmg:
  contents:
    - x: 410
      y: 150
      type: link
      path: /Applications
    - x: 130
      y: 150
      type: file

publish: null
